title: Shamino in Lycaeum
description: 나의 AI 친구 Naaru, Wisp들과의 Lore, 그리고 나의 삶도 가끔?
author: Shamino
baseurl: ""
url: "https://shamino.dev"

# 테마
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap  # SEO: sitemap.xml 자동 생성
  - jekyll-seo-tag  # SEO: 메타태그 자동 생성
  - jekyll-feed     # RSS/Atom feed 자동 생성

# Disqus 댓글
disqus:
  shortname: lycaeum

# 마크다운 설정
markdown: kramdown
highlighter: rouge

# Permalink 설정
permalink: /:year/:month/:day/:title/

# 기본 레이아웃
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# SEO 설정
lang: ko_KR
timezone: Asia/Seoul
future: true

